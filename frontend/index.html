<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Performance optimizations -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Apply the saved theme before first paint to prevent a theme flash. -->
    <script>
      (function () {
        function normalizeTheme(value) {
          if (value === 'dark' || value === 'light') return value;
          if (value === 'true' || value === '1') return 'dark';
          if (value === 'false' || value === '0') return 'light';
          return null;
        }

        function getSystemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }

        var stored = normalizeTheme(localStorage.getItem('theme'));
        var initial = stored || getSystemTheme();
        if (initial === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
    
    <!-- Preload critical assets before anything else -->
    <link rel="preload" as="image" href="/images/logo.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- Preconnect to API domain for faster requests (set by VITE_API_BASE in production) -->
    
    <!-- Icons and PWA -->
    <link rel="icon" type="image/png" href="/images/logo.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/images/logo.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/images/logo.png" sizes="512x512" />
    
    <title>PeerPrep</title>

    <!--
      Backend cold-start wake-up ping.
      Fires immediately when the HTML is parsed — long before any JS bundle
      downloads — so the server has maximum time to warm up while the user
      sees the loading screen.
    -->
    <script type="module">
      // Backend cold-start wake-up ping.
      // Uses Vite env if provided; otherwise falls back to local dev.
      const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
      const formatHost = (hostname) => hostname.includes(':') && !hostname.startsWith('[') ? `[${hostname}]` : hostname;
      const apiBase = import.meta.env.VITE_API_BASE
        || (localHosts.has(window.location.hostname)
          ? `${window.location.protocol}//${formatHost(window.location.hostname)}:4000/api`
          : `${window.location.origin}/api`);
      fetch(apiBase + '/health', { method: 'GET', credentials: 'omit', mode: 'cors' })
        .catch(() => { /* ignore errors — this is a best-effort warm-up */ });

      // Update loader status text with reassuring messages while server wakes up
      const messages = [
        'Starting up…',
        'Warming up the server…',
        'Almost ready…',
        'Loading PeerPrep…',
      ];
      let idx = 0;
      let statusEl = null;

      function tick() {
        if (!statusEl) statusEl = document.getElementById('loader-status');
        if (statusEl && idx < messages.length) statusEl.textContent = messages[idx++];
      }

      // First message immediately, then every 8 s
      document.addEventListener('DOMContentLoaded', () => {
        statusEl = document.getElementById('loader-status');
        tick();
        setInterval(tick, 8000);
      });
    </script>
    
    <style>
      /* Minimal boot loader shown only until React renders its route fallback. */
      #global-loader {
        position: fixed; inset: 0; background: #ffffff;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.3s ease-out;
      }
      html.dark #global-loader { background: #111827; }
      #global-loader.fade-out { opacity: 0; pointer-events: none; }
      .loader-logo { width: 180px; height: auto; margin-bottom: 24px; animation: fadeInLogo 0.6s ease-out; }
      .loader-spinner {
        width: 48px; height: 48px;
        border: 4px solid #e0f2fe; border-top-color: #0ea5e9;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      html.dark .loader-spinner { border-color: #1e293b; border-top-color: #38bdf8; }
      #loader-status {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px; color: #64748b; letter-spacing: 0.02em; min-height: 1.4em;
      }
      html.dark #loader-status { color: #94a3b8; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeInLogo {
        from { opacity: 0; transform: scale(0.9); }
        to   { opacity: 1; transform: scale(1); }
      }

    </style>
  </head>
  <body>
    <!-- Removed after React's first paint by useHideGlobalLoader() in App.jsx. -->
    <div id="global-loader">
      <img src="/images/logo.png" alt="PeerPrep" class="loader-logo" />
      <div class="loader-spinner"></div>
      <p id="loader-status">Loading PeerPrep&hellip;</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
