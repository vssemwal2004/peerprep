<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Performance optimizations -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Apply the saved theme before first paint to prevent a theme flash. -->
    <script>
      (function () {
        function normalizeTheme(value) {
          if (value === 'dark' || value === 'light') return value;
          if (value === 'true' || value === '1') return 'dark';
          if (value === 'false' || value === '0') return 'light';
          return null;
        }

        function getSystemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }

        var stored = normalizeTheme(localStorage.getItem('theme'));
        var initial = stored || getSystemTheme();
        if (initial === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
    
    <!-- Preconnect to API domain for faster requests (set by VITE_API_BASE in production) -->
    
    <!-- Icons and PWA -->
    <link rel="icon" type="image/png" href="/images/logo.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/images/logo.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/images/logo.png" sizes="512x512" />
    
    <title>PeerPrep</title>

    <!--
      Backend cold-start wake-up ping.
      Fires immediately when the HTML is parsed — long before any JS bundle
      downloads — so the server has maximum time to warm up while the user
      sees the loading screen.
    -->
    <script type="module">
      // Backend cold-start wake-up ping.
      // Uses Vite env if provided; otherwise falls back to local dev.
      const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
      const formatHost = (hostname) => hostname.includes(':') && !hostname.startsWith('[') ? `[${hostname}]` : hostname;
      const apiBase = import.meta.env.VITE_API_BASE
        || (localHosts.has(window.location.hostname)
          ? `${window.location.protocol}//${formatHost(window.location.hostname)}:4000/api`
          : `${window.location.origin}/api`);
      fetch(apiBase + '/health', { method: 'GET', credentials: 'omit', mode: 'cors' })
        .catch(() => { /* ignore errors — this is a best-effort warm-up */ });
    </script>

    <style>
      /* Dependency-free boot screen. The mark and wordmark are inline so branding
         still renders when the browser is offline or its cache is empty. */
      #global-loader {
        --gl-brand: #00a1db; --gl-ink: #23252b; --gl-ease: cubic-bezier(.22, 1, .36, 1);
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        overflow: hidden;
        background: #f8f8f6;
        transition: opacity .26s ease, visibility .26s ease;
      }
      #global-loader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
      .gl-content { display: grid; justify-items: center; gap: 22px; }
      .gl-mark {
        position: relative; width: 76px; height: 76px; display: grid; place-items: center;
        border: 1px solid rgba(35,37,43,.1); border-radius: 50%;
        box-shadow: 0 16px 46px rgba(0,161,219,.08);
      }
      .gl-mark::before {
        content: ""; position: absolute; inset: -1px; border-radius: inherit;
        background: conic-gradient(from -25deg, transparent 0 72%, var(--gl-brand) 86%, transparent 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        animation: gl-orbit 1.05s linear infinite;
      }
      .gl-mark img { width: 40px; height: 40px; object-fit: contain; }
      .gl-brand { display: flex; align-items: baseline; gap: 10px; color: var(--gl-ink); }
      .gl-brand strong { font: 750 23px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.04em; }
      .gl-brand i { width: 4px; height: 4px; border-radius: 50%; background: var(--gl-brand); }
      .gl-bar {
        position: relative; width: 142px; height: 1px; overflow: hidden;
        background: rgba(35,37,43,.1);
      }
      .gl-bar::after {
        content: ""; position: absolute; inset: 0; background: var(--gl-brand);
        transform-origin: 0 50%; animation: gl-bar .95s var(--gl-ease) infinite;
        will-change: transform;
      }
      .gl-tag {
        margin: -9px 0 0; font-family: ui-monospace, 'SF Mono', Consolas, monospace;
        font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #767983;
      }
      @keyframes gl-orbit { to { transform: rotate(360deg); } }
      @keyframes gl-bar { 0% { transform: scaleX(0); } 55% { transform: scaleX(1); transform-origin: 0 50%; } 56% { transform-origin: 100% 50%; } 100% { transform: scaleX(0); transform-origin: 100% 50%; } }
      @media (prefers-reduced-motion: reduce) {
        #global-loader *, #global-loader *::before, #global-loader *::after { animation: none !important; }
        .gl-mark::before, .gl-bar::after { opacity: .55; transform: none; }
      }
    </style>
  </head>
