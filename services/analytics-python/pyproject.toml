[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peerprep-analytics-python"
version = "0.1.0"
description = "Internal deterministic analytics service for PeerPrep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.4,<4.15",
  "fastapi>=0.115,<0.116",
  "PyJWT>=2.9,<3",
  "pydantic>=2.8,<3",
  "polars>=1.0,<2",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
